#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/caravan ./cmd/caravan"
  delay = 1000
  entrypoint = ["./tmp/caravan", "serve"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "web/node_modules"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[misc]
  clean_on_exit = true
