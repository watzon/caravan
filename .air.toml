#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/caravan ./cmd/caravan"
  delay = 1000
  entrypoint = ["./tmp/caravan", "serve", "--config", "tmp/caravan.yaml", "--data-dir", "tmp/data"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "web/node_modules", "web/dist", "web/src"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[misc]
# Must stay false: the dev storage root (tmp/media) lives inside tmp_dir, and
# clean_on_exit deletes the whole tmp tree on air exit, which is how the
# library and incomplete downloads got wiped once already.
clean_on_exit = false
