name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt has no check mode: it lists what it would rewrite, so a
      # non-empty list is the failure.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./web)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # -count=1 defeats the test cache: CI must actually run the tests.
      - name: test
        run: go test -count=1 ./...

      - name: build
        run: go build ./...
      - name: vulnerability scan
        run: |
          GOBIN="${RUNNER_TEMP}/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          govulncheck ./...

      - name: embedded binary smoke
        run: go test -count=1 -run '^TestBinaryServesEmbeddedSPA$' ./cmd/caravan

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run check

      - name: test
        run: |
          stderr_file="${RUNNER_TEMP}/caravan-web-test-stderr"
          set +e
          npm test 2>"$stderr_file"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat "$stderr_file"
            exit "$status"
          fi
          if [ -s "$stderr_file" ]; then
            echo "Unexpected stderr from frontend tests:"
            cat "$stderr_file"
            exit 1
          fi

      - name: build
        run: npm run build

      - name: verify embedded SPA is fresh
        working-directory: .
        run: git diff --exit-code -- web/dist

  cross-compile:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # SPEC §4 rules out cgo, so every release target is a plain
      # GOOS/GOARCH build with no cross toolchain.
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  race:
    name: Focused race coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: race test
        run: go test -race -short -count=1 ./internal/api ./internal/automation ./internal/download ./internal/store ./cmd/caravan

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is the Docker deployment mode (SPEC §2.1). Building it here
      # is what keeps the three-stage Dockerfile honest: it rebuilds the SPA
      # and the binary from source, so a break shows up on the commit that
      # caused it rather than the first time somebody runs `docker compose up`.
      - name: build image
        run: docker build --build-arg VERSION=ci -t caravan:ci .

      # The image is useless if the binary inside it cannot start, and a
      # static-linking or base-image mistake shows up exactly here.
      - name: binary runs in the image
        run: docker run --rm caravan:ci version
